<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Department Service</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div>
      <h1>Department Service</h1>
      <p>Runs on port 8082 · database: department_db</p>
    </div>
  </header>

  <main class="grid">
    <section class="panel" id="panel">
      <div class="panel-head">
        <div>
          <h2>🏢 Department Service</h2>
          <small>http://localhost:8082 · department_db</small>
        </div>
        <span class="badge" data-status>Checking...</span>
      </div>
      <form data-form novalidate>
        <input type="hidden" name="id">
        <div class="row">
          <div class="field"><label>Department name</label><input name="name" placeholder="IT"><div class="err"></div></div>
          <div class="field"><label>Location</label><input name="location" placeholder="Bhubaneswar"><div class="err"></div></div>
        </div>
        <div class="actions">
          <button type="submit" class="btn primary" data-submit>Add Department</button>
          <button type="button" class="btn ghost" data-cancel hidden>Cancel</button>
        </div>
      </form>
      <div class="table-wrap">
        <table>
          <thead><tr><th>ID</th><th>Name</th><th>Location</th><th></th></tr></thead>
          <tbody data-body></tbody>
        </table>
        <p class="empty" data-empty hidden>No departments yet. Add one above.</p>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script src="js/app.js"></script>
</body>
</html>
